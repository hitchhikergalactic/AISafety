name: Actualizar eventos

# Cada día lee los calendarios de Luma de iaS y de rediaS y guarda los próximos eventos en src/data/eventos.json y eventos-red.json.
# Si hay cambios, los sube a main y la web se vuelve a publicar con las fechas nuevas.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/actualizar-eventos.mjs
      - name: Publicar si hay cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eventos.json src/data/eventos-red.json
          git commit -m "Eventos: próximos eventos desde Luma"
          git push
